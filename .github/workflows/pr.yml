name: PR

on:
  pull_request:

permissions:
  actions: read # The trusted workflow gate refreshes workflow run identity.
  contents: read
  pull-requests: read # The trusted workflow gate verifies current PR state.

jobs:
  ci:
    # Master requires CODEOWNERS review for .github/**, including this workflow.
    # The AWS runner group permits pr-trusted.yml@refs/heads/master.
    # The runner allowlist requires this protected branch ref; a SHA changes routing.
    # zizmor: ignore[unpinned-uses]
    uses: paperclipai/paperclip/.github/workflows/pr-trusted.yml@master
